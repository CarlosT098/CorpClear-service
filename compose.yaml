services:
  api:
    build:
      context: .
      dockerfile: corpclear-service-api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-corpclear}
      POSTGRES_USER: ${POSTGRES_USER:-corpclear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpclear_local}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corpclear}
      POSTGRES_USER: ${POSTGRES_USER:-corpclear}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corpclear_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
